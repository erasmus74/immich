#
# Fork stack: Immich server + web built from this checkout, ML on AMD ROCm.
# Start/stop on demand:
#   docker compose -f docker/docker-compose.fork-amd.yml up -d --build
#   docker compose -f docker/docker-compose.fork-amd.yml stop            # idle the stack
#   docker compose -f docker/docker-compose.fork-amd.yml stop immich-machine-learning  # free the GPU only
#   docker compose -f docker/docker-compose.fork-amd.yml down            # remove containers (data persists)
#
name: immich-fork

services:
  immich-server:
    container_name: immich_server_fork
    image: immich-server-fork:latest
    build:
      context: ../
      dockerfile: server/Dockerfile
    volumes:
      - ${UPLOAD_LOCATION}/photos:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning_fork
    image: immich-ml-fork-rocm7.2:latest
    build:
      context: ../machine-learning
      dockerfile: Dockerfile
      args:
        DEVICE: rocm
        INSTALL_CAPTION: "true"
        CAPTION_TORCH_INDEX: https://download.pytorch.org/whl/rocm7.2
    extends:
      file: hwaccel.ml.yml
      service: rocm
    # no published port: the server reaches it as http://immich-machine-learning:3003 on the compose network
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    environment:
      MACHINE_LEARNING_DEVICE_ID: '0'
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis_fork
    image: docker.io/valkey/valkey:9@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres_fork
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${UPLOAD_LOCATION}/postgres:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false

volumes:
  model-cache:
